spring:
  application:
    name: gestion-stages

  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_stages_db
    username: othman
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 4485cc7271203b
    password: 091fe02078ba02
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

logging:
  level:
    com.OCP.Gestion_Stages: DEBUG
    org.hibernate.SQL: DEBUG

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000

app:
  storage:
    # Dossier racine où sont écrits les fichiers uploadés (CV, documents).
    path: ./uploads
  retention:
    # Durée de conservation des archives (en années) avant anonymisation/purge.
    years: 1
  ollama:
    url: http://localhost:11434/api/generate
    model: llama3.2:3b
    embed-model: nomic-embed-text   # modèle d'embeddings (matching sémantique)
    timeout-seconds: 180     # marge confortable pour le LLM local sur CPU
    temperature: 0.2         # bas = scores déterministes
    keep-alive: 30m          # garde le modèle chargé en mémoire (évite le rechargement à froid)
    num-ctx: 4096            # contexte sélectif (ciblé par question) = court
  ocr:
    tessdata-path: /usr/local/share/tessdata   # données Tesseract (brew)
    languages: fra+eng                          # langues OCR